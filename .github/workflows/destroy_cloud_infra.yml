name: Destroy Infra Cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to destroy'
        required: true
        type: choice
        options:
          - DEV (Cloud AWS)
          - hml
          - prd
      confirm:
        description: 'Type DESTROY to confirm infrastructure destruction'
        required: true
        type: string
      full_destroy:
        description: 'HML only: destroy ALL modules (VPC, IAM, Peripherals, ECS, Databricks). Default false = Databricks-only (~$11/month idle preserved).'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: sa-east-1
  TF_VERSION:      1.9.8

jobs:

  safety-check:
    name: Safety check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Enforce develop branch
        run: bash "$GITHUB_WORKSPACE/scripts/ci/branch_guard.sh"
      - name: Validate confirmation
        run: bash "$GITHUB_WORKSPACE/scripts/ci/check_commit_confirmation.sh"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}

  preflight-oidc:
    name: Preflight — OIDC role variables
    needs: safety-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate AWS_DEPLOY_ROLE_{DEV,HML,PRD} are set
        run: |
          MISSING=""
          [ -z "${{ vars.AWS_DEPLOY_ROLE_DEV }}" ] && MISSING="$MISSING AWS_DEPLOY_ROLE_DEV"
          [ -z "${{ vars.AWS_DEPLOY_ROLE_HML }}" ] && MISSING="$MISSING AWS_DEPLOY_ROLE_HML"
          [ -z "${{ vars.AWS_DEPLOY_ROLE_PRD }}" ] && MISSING="$MISSING AWS_DEPLOY_ROLE_PRD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository variable(s):${MISSING}. Run scripts/ci/publish_oidc_vars.sh after applying services/prd/00_bootstrap — see docs/runbooks/00-bootstrap-apply.md."
            exit 1
          fi
          echo "All required OIDC role variables present."

  # ══════════════════════════════════════════════════════════════
  #  DEV
  # ══════════════════════════════════════════════════════════════

  dev-destroy:
    name: DEV — Destroy all modules
    concurrency:
      group: tf-dev
      cancel-in-progress: false
    needs: [safety-check, preflight-oidc]
    if: github.event.inputs.environment == 'DEV (Cloud AWS)'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Destroy DEV
        run: bash "$GITHUB_WORKSPACE/scripts/ci/destroy_env.sh" dev

  # ══════════════════════════════════════════════════════════════
  #  HML
  # ══════════════════════════════════════════════════════════════
  # - full_destroy=false (default): only Databricks is destroyed.
  #   VPC, IAM, Peripherals and ECS are preserved (~$11/month idle).
  # - full_destroy=true: full teardown — all modules destroyed, S3 preserved.
  #   Use to test full destroy/redeploy cycle or before extended pauses.

  hml-destroy:
    name: HML — Destroy modules
    concurrency:
      group: tf-hml
      cancel-in-progress: false
    needs: [safety-check, preflight-oidc]
    if: github.event.inputs.environment == 'hml'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: hml
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_HML }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Destroy HML
        run: bash "$GITHUB_WORKSPACE/scripts/ci/destroy_env.sh" hml "${{ github.event.inputs.full_destroy }}"
        env:
          DATABRICKS_ACCOUNT_ID:    ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID:     ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

  # ══════════════════════════════════════════════════════════════
  #  PRD
  # ══════════════════════════════════════════════════════════════

  prd-destroy:
    name: PRD — Destroy all modules
    concurrency:
      group: tf-prd
      cancel-in-progress: false
    needs: [safety-check, preflight-oidc]
    if: github.event.inputs.environment == 'prd'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PRD }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Destroy PRD
        run: bash "$GITHUB_WORKSPACE/scripts/ci/destroy_env.sh" prd
        env:
          DATABRICKS_ACCOUNT_ID:           ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID:            ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET:        ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          TF_VAR_databricks_client_id:     ${{ secrets.DATABRICKS_CLIENT_ID }}
          TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

