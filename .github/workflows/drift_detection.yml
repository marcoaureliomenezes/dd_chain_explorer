name: Drift Detection

# ── IS-12 — Weekly drift scan for persistent environments ────────
# Runs `terraform plan` (no apply) on every CI-managed stack every Monday.
# Any pending change = drift detected -> job fails with ::error:: annotation.
#
# Coverage (T-A.8 — single source of truth is scripts/ci/stack_map.json):
#   DEV — 01_peripherals, 02_lambda
#   HML — 04_peripherals
#   PRD — 03_iam, 04_peripherals, 06_lambda
#
# prd/00_bootstrap is operator_only (never planned by CI, D14/O-1); prd/01_tf_state is
# the remote-state backend and is not drift-scanned here. Every job assumes
# AWS_DEPLOY_ROLE_READONLY, which carries no dynamodb:PutItem/DeleteItem on the state
# lock table (SEC-I-01) — every plan below passes TF_PLAN_ARGS=-lock=false (T-A.8, F-04).
#
# Can also be triggered manually via workflow_dispatch for on-demand checks.

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read  # F-04: id-token: write is granted only on the jobs that need it

# CI-M9 — Serialize drift scans. Concurrent runs plan against the same remote
# state and collide on the Terraform state lock. Do not cancel an in-flight scan
# (cancel-in-progress: false) so a manual workflow_dispatch never aborts the
# scheduled run mid-plan and leave a stale lock.
concurrency:
  group: drift-detection
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  TF_VERSION: 1.9.8

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Preflight: OIDC role variable must exist before any drift job ─────────
  preflight-oidc:
    name: Preflight — OIDC role variable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate AWS_DEPLOY_ROLE_READONLY is set
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_READONLY }}" ]; then
            echo "::error::AWS_DEPLOY_ROLE_READONLY is not set. Run scripts/ci/publish_oidc_vars.sh after applying services/prd/00_bootstrap — see docs/runbooks/00-bootstrap-apply.md."
            exit 1
          fi
          echo "AWS_DEPLOY_ROLE_READONLY present — OK."

  # ── DEV ──────────────────────────────────────────────────────────────────

  drift-dev-peripherals:
    name: Drift — DEV/Peripherals
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_READONLY via OIDC
    defaults:
      run:
        working-directory: services/dev/01_peripherals
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_READONLY }}
          aws-region:     ${{ env.AWS_REGION }}
      # F-QA-3 cutover-safety: non-mutating role-assumption evidence (read-only role).
      - name: Verify assumed role (sts get-caller-identity)
        run: aws sts get-caller-identity
      - run: terraform init -input=false
      - name: Terraform Plan (Drift Check)
        id: plan
        run: bash "$GITHUB_WORKSPACE/scripts/ci/tf_plan.sh"
        env:
          MODULE_NAME: DEV/Peripherals
          TAIL_LINES: "30"
          TF_PLAN_ARGS: "-lock=false"
          TF_VAR_project_version: "drift-check"
          TF_VAR_databricks_dev_uc_external_id: ${{ secrets.DATABRICKS_UC_EXTERNAL_ID }}
      - name: Alert on drift
        if: steps.plan.outputs.plan_has_changes == 'true'
        run: |
          echo "::error::DRIFT DETECTED in DEV/Peripherals — unexpected pending changes found."
          exit 1

  drift-dev-lambda:
    name: Drift — DEV/Lambda
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_READONLY via OIDC
    defaults:
      run:
        working-directory: services/dev/02_lambda
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_READONLY }}
          aws-region:     ${{ env.AWS_REGION }}
      - run: mkdir -p .lambda_zip
      - run: terraform init -input=false
      - name: Terraform Plan (Drift Check)
        id: plan
        run: bash "$GITHUB_WORKSPACE/scripts/ci/tf_plan.sh"
        env:
          MODULE_NAME: DEV/Lambda
          TAIL_LINES: "30"
          TF_PLAN_ARGS: "-lock=false"
          TF_VAR_project_version: "drift-check"
      - name: Alert on drift
        if: steps.plan.outputs.plan_has_changes == 'true'
        run: |
          echo "::error::DRIFT DETECTED in DEV/Lambda — unexpected pending changes found."
          exit 1

  # ── HML ──────────────────────────────────────────────────────────────────

  drift-hml-peripherals:
    name: Drift — HML/Peripherals
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_READONLY via OIDC
    defaults:
      run:
        working-directory: services/hml/04_peripherals
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_READONLY }}
          aws-region:     ${{ env.AWS_REGION }}
      - run: terraform init -input=false
      - name: Terraform Plan (Drift Check)
        id: plan
        run: bash "$GITHUB_WORKSPACE/scripts/ci/tf_plan.sh"
        env:
          MODULE_NAME: HML/Peripherals
          TAIL_LINES: "30"
          TF_PLAN_ARGS: "-lock=false"
          TF_VAR_project_version: "drift-check"
          TF_VAR_databricks_hml_uc_external_id: ${{ secrets.DATABRICKS_UC_EXTERNAL_ID }}
      - name: Alert on drift
        if: steps.plan.outputs.plan_has_changes == 'true'
        run: |
          echo "::error::DRIFT DETECTED in HML/Peripherals — unexpected pending changes found."
          exit 1

  # ── PRD ──────────────────────────────────────────────────────────────────

  drift-prd-iam:
    name: Drift — PRD/IAM
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_READONLY via OIDC
    defaults:
      run:
        working-directory: services/prd/03_iam
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_READONLY }}
          aws-region:     ${{ env.AWS_REGION }}
      - run: terraform init -input=false
      - name: Terraform Plan (Drift Check)
        id: plan
        run: bash "$GITHUB_WORKSPACE/scripts/ci/tf_plan.sh"
        env:
          MODULE_NAME: PRD/IAM
          TAIL_LINES: "30"
          TF_PLAN_ARGS: "-lock=false"
          TF_VAR_project_version: "drift-check"
      - name: Alert on drift
        if: steps.plan.outputs.plan_has_changes == 'true'
        run: |
          echo "::error::DRIFT DETECTED in PRD/IAM — unexpected pending changes found."
          exit 1

  drift-prd-peripherals:
    name: Drift — PRD/Peripherals
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_READONLY via OIDC
    defaults:
      run:
        working-directory: services/prd/04_peripherals
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_READONLY }}
          aws-region:     ${{ env.AWS_REGION }}
      - run: terraform init -input=false
      - name: Terraform Plan (Drift Check)
        id: plan
        run: bash "$GITHUB_WORKSPACE/scripts/ci/tf_plan.sh"
        env:
          MODULE_NAME: PRD/Peripherals
          TAIL_LINES: "30"
          TF_PLAN_ARGS: "-lock=false"
          TF_VAR_project_version: "drift-check"
      - name: Alert on drift
        if: steps.plan.outputs.plan_has_changes == 'true'
        run: |
          echo "::error::DRIFT DETECTED in PRD/Peripherals — unexpected pending changes found."
          exit 1

  drift-prd-lambda:
    name: Drift — PRD/Lambda
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_READONLY via OIDC
    defaults:
      run:
        working-directory: services/prd/06_lambda
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_READONLY }}
          aws-region:     ${{ env.AWS_REGION }}
      - run: mkdir -p .lambda_zip
      - run: terraform init -input=false
      - name: Resolve lambda layer artifact (T-A.7, WS-A)
        id: resolve-layer
        run: |
          set -euo pipefail
          OUT="$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve_layer.sh" \
            dm-chain-explorer-artifacts lambda-layers/dm-chain-utils/)"
          echo "${OUT}"
          echo "layer_s3_key=$(echo "${OUT}" | grep -oP 'LAYER_S3_KEY=\K\S+')" >> "$GITHUB_OUTPUT"
          echo "layer_sha256=$(echo "${OUT}" | grep -oP 'LAYER_SHA256=\K\S+')" >> "$GITHUB_OUTPUT"
          echo "layer_sha256_b64=$(echo "${OUT}" | grep -oP 'LAYER_SHA256_B64=\K\S+')" >> "$GITHUB_OUTPUT"
      - name: Terraform Plan (Drift Check)
        id: plan
        run: bash "$GITHUB_WORKSPACE/scripts/ci/tf_plan.sh"
        env:
          MODULE_NAME: PRD/Lambda
          TAIL_LINES: "30"
          TF_PLAN_ARGS: "-lock=false"
          TF_VAR_project_version: "drift-check"
          # T-A.7, WS-A: the placeholder this job used to pass here differed from
          # live state's actually-applied layer_s3_key/sha256 on every run, so this
          # drift check always reported a false-positive diff on those 2 attributes.
          # Resolved to the newest real artifact instead — a real drift check again.
          TF_VAR_layer_s3_bucket: "dm-chain-explorer-artifacts"
          TF_VAR_layer_s3_key:    ${{ steps.resolve-layer.outputs.layer_s3_key }}
          TF_VAR_layer_sha256_b64: ${{ steps.resolve-layer.outputs.layer_sha256_b64 }}
      - name: Alert on drift
        if: steps.plan.outputs.plan_has_changes == 'true'
        run: |
          echo "::error::DRIFT DETECTED in PRD/Lambda — unexpected pending changes found."
          exit 1

  # ── Summary ──────────────────────────────────────────────────────────────

  drift-summary:
    name: Drift Summary
    needs:
      - drift-dev-peripherals
      - drift-dev-lambda
      - drift-hml-peripherals
      - drift-prd-iam
      - drift-prd-peripherals
      - drift-prd-lambda
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Report drift results
        run: |
          echo "## Drift Detection Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| DEV/Peripherals | ${{ needs.drift-dev-peripherals.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DEV/Lambda      | ${{ needs.drift-dev-lambda.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HML/Peripherals | ${{ needs.drift-hml-peripherals.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PRD/IAM         | ${{ needs.drift-prd-iam.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PRD/Peripherals | ${{ needs.drift-prd-peripherals.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PRD/Lambda      | ${{ needs.drift-prd-lambda.result }} |" >> "$GITHUB_STEP_SUMMARY"
