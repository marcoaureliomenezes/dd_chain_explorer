version: 2

# F-06 (public-repo CI security audit, 2026-08-23) — keep every SHA-pinned
# `uses:` action and every hash-locked Python dependency current. Dependabot
# opens a PR bumping the pinned commit SHA + `# vX.Y.Z` comment; the `quality`
# job (actionlint + zizmor + pytest) gates each PR like any other change.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/apps/lambda"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
