name: Deploy All DM Applications

# Direct application deploy: Lambda (Terraform apply) + DABs (bundle deploy),
# both behind the informed GitHub-environment approval gate. The retired
# capture lane (ephemeral streaming compute tasks, message-queue/delivery-stream HML
# provisioning, HML integration tests) is gone (A3, DRIFT-02) — capture now
# lives entirely in the separate dd-chain-capture project.
#
#   1. CHECK   — VERSION sanity (single axis, T-A.9)
#   2. LAMBDA  — terraform apply on the target's Lambda stack (dev/prd only;
#                hml carries no Lambda stack, B2)
#   3. DABS    — apps/dabs/deploy_all.sh <target>
#
# Both LAMBDA and DABS run behind the target's GitHub environment — `dev`/
# `hml` need no reviewer, `production` requires the operator (T-A.10).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: prod
        type: choice
        options: [dev, hml, prod]

permissions:
  contents: read  # F-04: id-token: write is granted only on the jobs that need it

concurrency:
  group: deploy-apps-${{ inputs.target }}
  cancel-in-progress: false

env:
  AWS_REGION:      sa-east-1
  TF_VERSION:      1.9.8
  DABS_PATH:       apps/dabs
  LAMBDA_DIR:      apps/lambda
  UTILS_DIR:       utils

jobs:

  # ── Branch guard ───────────────────────────────────────────────────────────
  branch-guard:
    name: Branch guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Enforce develop branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/develop" ]; then
            echo "::error::This workflow must be triggered from the 'develop' branch. Got: ${GITHUB_REF}"
            exit 1
          fi
          echo "Branch check passed: ${GITHUB_REF}"

  # ── Preflight: OIDC role variable must exist before any AWS-touching job ──
  # (A2/AC-3b) — fails loudly, at this step, instead of an empty
  # `role-to-assume` failing opaquely inside configure-aws-credentials.
  preflight-oidc:
    name: Preflight — OIDC role variable
    needs: branch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Resolve and validate AWS_DEPLOY_ROLE_* for the target
        env:
          # F-09: env-indirection — inputs.target is a `type: choice`, but
          # zizmor still flags any raw `${{ }}` inside `run:`; never substitute
          # it directly into a script body.
          TARGET: ${{ inputs.target }}
        run: |
          case "${TARGET}" in
            dev)  ROLE="${{ vars.AWS_DEPLOY_ROLE_DEV }}" ;;
            hml)  ROLE="${{ vars.AWS_DEPLOY_ROLE_HML }}" ;;
            prod) ROLE="${{ vars.AWS_DEPLOY_ROLE_PRD }}" ;;
            *)    echo "::error::Unknown target '${TARGET}'"; exit 1 ;;
          esac
          if [ -z "$ROLE" ]; then
            echo "::error::AWS_DEPLOY_ROLE_* for target '${TARGET}' is not set. Run scripts/ci/publish_oidc_vars.sh after applying services/prd/00_bootstrap (T-A.3/T-A.4) — see docs/runbooks/00-bootstrap-apply.md."
            exit 1
          fi
          echo "OIDC role variable present for target '${TARGET}' — OK."

  # ── Check: VERSION sanity ───────────────────────────────────────────────────
  check-version:
    name: Check — VERSION
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read VERSION (one version axis, T-A.9)
        id: ver
        env:
          TARGET: ${{ inputs.target }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION file is empty."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Deploying v${VERSION} to target '${TARGET}'."

  # ── Lambda layer: from-source build + content-addressed S3 upload (T-A.7, T-B.14) ──
  # Only prd/06_lambda consumes the shared dm-chain-utils layer (var.layer_s3_key /
  # var.layer_sha256, services/prd/06_lambda/variables.tf — no default, CI-supplied).
  # dev/02_lambda does not (its own module has no layer_* variable) — skip for dev/hml.
  build-layer:
    name: Lambda layer — build + upload
    needs: preflight-oidc
    if: inputs.target == 'prod'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_PRD via OIDC
    timeout-minutes: 30
    outputs:
      layer_s3_key: ${{ steps.build.outputs.layer_s3_key }}
      layer_sha256_b64: ${{ steps.build.outputs.layer_sha256_b64 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PRD }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-all-dm-applications-build-layer
          mask-aws-account-id: true
      - name: Build layer (from source, reproducible)
        id: build
        run: |
          set -euo pipefail
          OUT="$(bash "$GITHUB_WORKSPACE/scripts/build_lambda_layer.sh" | tail -1)"
          echo "${OUT}"
          LAYER_ZIP="$(echo "${OUT}" | grep -oP 'LAYER_ZIP=\K\S+')"
          LAYER_SHA256="$(echo "${OUT}" | grep -oP 'LAYER_SHA256=\K\S+')"
          LAYER_SHA256_B64="$(echo "${OUT}" | grep -oP 'LAYER_SHA256_B64=\K\S+')"
          S3_KEY="lambda-layers/dm-chain-utils/${LAYER_SHA256}.zip"
          echo "layer_zip=${LAYER_ZIP}"               >> "$GITHUB_OUTPUT"
          echo "layer_sha256_hex=${LAYER_SHA256}"     >> "$GITHUB_OUTPUT"
          echo "layer_sha256_b64=${LAYER_SHA256_B64}" >> "$GITHUB_OUTPUT"
          echo "layer_s3_key=${S3_KEY}"               >> "$GITHUB_OUTPUT"
      - name: Upload layer to artifacts bucket (skip if the content-addressed key already exists)
        run: |
          set -euo pipefail
          BUCKET="dm-chain-explorer-artifacts"
          KEY="${{ steps.build.outputs.layer_s3_key }}"
          # The S3 object metadata tag stays HEX (resolve_layer.sh cross-checks
          # it against the key-derived hex, T-R.2 F-02) -- distinct from the
          # base64 value this job exposes for source_code_hash.
          SHA256="${{ steps.build.outputs.layer_sha256_hex }}"
          if aws s3api head-object --bucket "${BUCKET}" --key "${KEY}" >/dev/null 2>&1; then
            echo "Object s3://${BUCKET}/${KEY} already exists — skipping upload (content-addressed, T-B.14)."
          else
            # T-A.7: tag the object with its own sha256 as S3 metadata so
            # scripts/ci/resolve_layer.sh (infra-only plans/applies) can cross-check
            # the key-derived hash against an independent source before trusting it.
            aws s3 cp "${{ steps.build.outputs.layer_zip }}" "s3://${BUCKET}/${KEY}" \
              --metadata "sha256=${SHA256}"
          fi

  # ── Lambda: terraform apply (dev/prd only — hml has no Lambda stack, B2) ──
  deploy-lambda:
    name: Lambda — Terraform apply (${{ inputs.target }})
    needs: [check-version, build-layer]
    if: |
      always() && inputs.target != 'hml' &&
      (needs.build-layer.result == 'success' || needs.build-layer.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || inputs.target }}
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume the target's AWS deploy role via OIDC
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ inputs.target == 'prod' && vars.AWS_DEPLOY_ROLE_PRD || vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-all-dm-applications-deploy-lambda
          mask-aws-account-id: true
      - name: Resolve Lambda stack path for target
        id: stack
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "${TARGET}" = "prod" ]; then
            echo "path=services/prd/06_lambda" >> "$GITHUB_OUTPUT"
          else
            echo "path=services/dev/02_lambda" >> "$GITHUB_OUTPUT"
          fi
      - name: terraform init + apply
        run: |
          terraform -chdir="$GITHUB_WORKSPACE/${{ steps.stack.outputs.path }}" \
            init -input=false -reconfigure
          terraform -chdir="$GITHUB_WORKSPACE/${{ steps.stack.outputs.path }}" \
            apply -input=false -auto-approve
        env:
          # T-B.14: prd/06_lambda has NO default for these — build-layer supplies them
          # (empty on dev/hml, where the stack declares no layer_* variable to consume).
          TF_VAR_layer_s3_bucket: "dm-chain-explorer-artifacts"
          TF_VAR_layer_s3_key:    ${{ needs.build-layer.outputs.layer_s3_key }}
          TF_VAR_layer_sha256_b64: ${{ needs.build-layer.outputs.layer_sha256_b64 }}

  # ── DABs: bundle deploy ─────────────────────────────────────────────────────
  deploy-dabs:
    name: DABs — Deploy bundles (${{ inputs.target }})
    needs: check-version
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || inputs.target }}
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@6bb7075f85b326f8b9ce160933dfe9bcd63c8121  # v1.13.0
      - name: Deploy all DABs components to ${{ inputs.target }}
        env:
          # F-07: environment-scoped secrets ONLY — dev/hml carry these three
          # (OAuth M2M service-principal); production carries none (no prod
          # Databricks workspace exists yet), so target=prod fails closed at
          # the non-empty assertion below instead of silently falling through
          # to another environment's credential.
          DATABRICKS_HOST:          ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID:     ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          # F-09: env-indirection — never substitute inputs.target directly
          # into a `run:` script body.
          TARGET: ${{ inputs.target }}
        run: |
          if [ -z "${DATABRICKS_HOST}" ] || [ -z "${DATABRICKS_CLIENT_ID}" ] || [ -z "${DATABRICKS_CLIENT_SECRET}" ]; then
            echo "::error::DATABRICKS_HOST/DATABRICKS_CLIENT_ID/DATABRICKS_CLIENT_SECRET are not set as environment secrets on this job's environment. dev/hml must carry all three (OAuth M2M service principal); production carries none by design (no prod Databricks workspace) and is expected to fail here."
            exit 1
          fi
          bash "${{ env.DABS_PATH }}/deploy_all.sh" "${TARGET}"
