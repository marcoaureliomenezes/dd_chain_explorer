name: Deploy Infra Cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - DEV (Cloud AWS)
          - hml
          - prd
      force_apply:
        description: 'Force apply / skip version tag check (PRD only)'
        required: false
        default: false
        type: boolean
      skip_databricks:
        description: 'Skip Databricks modules (PRD only)'
        required: false
        default: false
        type: boolean
      fast_mode:
        description: 'PRD only: speed up 05b by skipping Databricks cluster creation'
        required: false
        default: false
        type: boolean
      destroy_ack:
        description: 'HML/PRD: acknowledge that destroy-containing plans may apply (required when any pre-gate plan shows resource destroys — ADR-R6-4)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION:      sa-east-1
  TF_VERSION:      1.7.0
  DEV_PERIPHERALS: services/dev/01_peripherals
  DEV_LAMBDA:      services/dev/02_lambda

jobs:

  # ── Branch guard ───────────────────────────────────────────────
  branch-guard:
    name: Branch guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Enforce develop branch
        run: bash "$GITHUB_WORKSPACE/scripts/ci/branch_guard.sh"

  # ══════════════════════════════════════════════════════════════
  #  DEV (Cloud AWS)
  # ══════════════════════════════════════════════════════════════

  dev-detect-changes:
    name: DEV — Detect changes
    needs: branch-guard
    if: github.event.inputs.environment == 'DEV (Cloud AWS)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      peripherals_changed: ${{ steps.detect.outputs.peripherals_changed }}
      lambda_changed:      ${{ steps.detect.outputs.lambda_changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: Determine changed modules
        id: detect
        run: bash "$GITHUB_WORKSPACE/scripts/ci/detect_changes.sh"
        env:
          FORCE: ${{ github.event.inputs.force_apply }}

  dev-deploy-peripherals:
    name: DEV — Deploy Peripherals AWS
    concurrency:
      group: tf-dev-peripherals
      cancel-in-progress: false
    needs: dev-detect-changes
    if: needs.dev-detect-changes.outputs.peripherals_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.DEV_PERIPHERALS }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region:     ${{ env.AWS_REGION }}
      # F-QA-3 cutover-safety: non-mutating role-assumption evidence (dev deploy role).
      - name: Verify assumed role (sts get-caller-identity)
        run: aws sts get-caller-identity
      - run: terraform init -input=false
      - run: terraform validate
      - name: Read VERSION
        id: ver
        run: echo "version=$(cat ${{ github.workspace }}/VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Terraform Plan
        id: plan
        run: bash "$GITHUB_WORKSPACE/scripts/ci/tf_plan.sh"
        env:
          MODULE_NAME: DEV/Peripherals
          TAIL_LINES: "20"
          TF_VAR_project_version: ${{ steps.ver.outputs.version }}
      - name: Terraform Apply
        if: steps.plan.outputs.plan_has_changes == 'true'
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_project_version: ${{ steps.ver.outputs.version }}

  dev-deploy-lambda:
    name: DEV — Deploy Lambda AWS
    concurrency:
      group: tf-dev-lambda
      cancel-in-progress: false
    needs: [dev-detect-changes, dev-deploy-peripherals]
    if: |
      always() &&
      needs.dev-detect-changes.outputs.lambda_changed == 'true' &&
      (needs.dev-deploy-peripherals.result == 'success' || needs.dev-deploy-peripherals.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.DEV_LAMBDA }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Read VERSION
        id: ver
        run: echo "version=$(cat ${{ github.workspace }}/VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - run: mkdir -p .lambda_zip
      - run: terraform init -input=false
      - run: terraform validate
      - name: Terraform Plan
        id: plan
        run: bash "$GITHUB_WORKSPACE/scripts/ci/tf_plan.sh"
        env:
          MODULE_NAME: DEV/Lambda
          TAIL_LINES: "20"
          TF_VAR_project_version: ${{ steps.ver.outputs.version }}
      - name: Terraform Apply
        if: steps.plan.outputs.plan_has_changes == 'true'
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_project_version: ${{ steps.ver.outputs.version }}

  # ══════════════════════════════════════════════════════════════
  #  PRD — Layer 0: version check (gate for all PRD jobs)
  # ══════════════════════════════════════════════════════════════

  prd-check-version:
    name: PRD — Check version
    needs: branch-guard
    if: github.event.inputs.environment == 'prd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: Read and validate VERSION
        id: ver
        run: bash "$GITHUB_WORKSPACE/scripts/ci/check_prd_version.sh"
        env:
          FORCE_APPLY: ${{ github.event.inputs.force_apply }}

  # ── PRD — Phase 1: pre-gate PLAN (informed gate, ADR-R6-4/R6-5) ─
  #  Plans every currently-plannable stack (per scripts/ci/stack_map.json),
  #  uploads each tfplan binary + full plan.txt as artifacts, writes a
  #  consolidated add/change/destroy summary BEFORE the environment gate, and
  #  enforces the destroy-acknowledgment gate. NO environment gate here — the
  #  approver reviews this job's run summary, then approves prd-apply.

  prd-plan:
    name: PRD — Plan (pre-gate)
    concurrency:
      group: tf-prd-deploy
      cancel-in-progress: false
    needs: prd-check-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Plan PRD (pre-gate)
        run: bash "$GITHUB_WORKSPACE/scripts/ci/plan_env.sh" prd
        env:
          DATABRICKS_ACCOUNT_ID:           ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID:            ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET:        ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          TF_VAR_databricks_client_id:     ${{ secrets.DATABRICKS_CLIENT_ID }}
          TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          TF_VAR_project_version:          ${{ needs.prd-check-version.outputs.version }}
          DESTROY_ACK:                     ${{ github.event.inputs.destroy_ack }}
          PLAN_ARTIFACT_DIR:               ${{ github.workspace }}/.plan-artifacts
      - name: Upload saved plans
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4
        with:
          name: prd-saved-plans
          path: .plan-artifacts/**
          if-no-files-found: warn
          retention-days: 7

  # ── PRD — Phase 2: environment-gated APPLY ─────────────────────
  #  The single informed environment gate (ADR-R6-4). After approval, deploy_env.sh
  #  applies in dependency order. Per ADR-R6-5 it re-plans each stack against current
  #  state immediately before its apply and applies ONLY that fresh per-stack tfplan —
  #  it never applies a stale saved plan, so a downstream stack whose upstream changed
  #  in-run (canonical 05a->05b: 05b's TF_VAR_workspace_host is re-derived from 05a's
  #  POST-apply output) is re-planned, not applied blind. This is the fail-closed
  #  re-plan branch of ADR-R6-5 (strictly stronger than reusing a saved binary). The
  #  saved pre-gate plans downloaded below are the approved baseline kept as run
  #  evidence; scripts/ci/plan_gate_check.sh `plan-diff` is the divergence guard a
  #  saved-plan-reuse optimization would gate on (unit-tested; fails closed on any
  #  count/address divergence).

  prd-apply:
    name: PRD — Apply (gated)
    concurrency:
      group: tf-prd-deploy
      cancel-in-progress: false
    needs:
      - prd-check-version
      - prd-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PRD }}
          aws-region:     ${{ env.AWS_REGION }}
      # F-QA-3 cutover-safety: non-mutating role-assumption evidence (prd deploy role).
      - name: Verify assumed role (sts get-caller-identity)
        run: aws sts get-caller-identity
      - name: Download saved plans
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4
        with:
          name: prd-saved-plans
          path: .plan-artifacts
      - name: Deploy PRD
        run: bash "$GITHUB_WORKSPACE/scripts/ci/deploy_env.sh" prd
        env:
          DATABRICKS_ACCOUNT_ID:           ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID:            ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET:        ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          TF_VAR_databricks_client_id:     ${{ secrets.DATABRICKS_CLIENT_ID }}
          TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          TF_VAR_project_version:          ${{ needs.prd-check-version.outputs.version }}
          SKIP_DATABRICKS:                 ${{ github.event.inputs.skip_databricks }}
          FAST_MODE:                       ${{ github.event.inputs.fast_mode }}

  # ── PRD git tag ────────────────────────────────────────────────

  prd-create-tag:
    name: PRD — Create git tag
    needs:
      - prd-check-version
      - prd-apply
    if: needs.prd-check-version.result == 'success' && needs.prd-apply.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag master
        run: |
          VERSION="${{ needs.prd-check-version.outputs.version }}"
          TAG="v${VERSION}-infra"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          if git tag --list | grep -qx "$TAG"; then
            echo "Tag $TAG already exists — skipping." >> $GITHUB_STEP_SUMMARY
          else
            git tag -a "$TAG" -m "PRD infra v${VERSION}"
            git push origin "$TAG"
            echo "## Tag created: \`$TAG\` on master" >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════════════════════════════
  #  HML — single job (all modules sequentially via wrapper script)
  # ══════════════════════════════════════════════════════════════

  # ── HML — Phase 1: pre-gate PLAN ───────────────────────────────
  hml-plan:
    name: HML — Plan (pre-gate)
    concurrency:
      group: tf-hml-deploy
      cancel-in-progress: false
    needs: branch-guard
    if: github.event.inputs.environment == 'hml'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PRD }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Plan HML (pre-gate)
        run: bash "$GITHUB_WORKSPACE/scripts/ci/plan_env.sh" hml
        env:
          DATABRICKS_ACCOUNT_ID:    ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID:     ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DESTROY_ACK:              ${{ github.event.inputs.destroy_ack }}
          PLAN_ARTIFACT_DIR:        ${{ github.workspace }}/.plan-artifacts
      - name: Upload saved plans
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4
        with:
          name: hml-saved-plans
          path: .plan-artifacts/**
          if-no-files-found: warn
          retention-days: 7

  # ── HML — Phase 2: environment-gated APPLY ─────────────────────
  hml-apply:
    name: HML — Apply (gated)
    concurrency:
      group: tf-hml-deploy
      cancel-in-progress: false
    needs:
      - branch-guard
      - hml-plan
    if: github.event.inputs.environment == 'hml'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: hml
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_HML }}
          aws-region:     ${{ env.AWS_REGION }}
      # F-QA-3 cutover-safety: non-mutating role-assumption evidence (hml deploy role).
      - name: Verify assumed role (sts get-caller-identity)
        run: aws sts get-caller-identity
      - name: Download saved plans
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4
        with:
          name: hml-saved-plans
          path: .plan-artifacts
      - name: Deploy HML
        run: bash "$GITHUB_WORKSPACE/scripts/ci/deploy_env.sh" hml
        env:
          DATABRICKS_ACCOUNT_ID:    ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID:     ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
