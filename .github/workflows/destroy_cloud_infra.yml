name: Destroy Infra Cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to destroy'
        required: true
        type: choice
        options:
          - DEV (Cloud AWS)
          - hml
          - prd
      confirm:
        description: 'Type DESTROY to confirm infrastructure destruction'
        required: true
        type: string
      full_destroy:
        description: 'Unused — hml has a single surviving stack (04_peripherals, post-B2 purge); destroy_env.sh ignores this flag (T-R.2 F-07).'
        required: false
        default: false
        type: boolean

permissions:
  contents: read  # F-04: id-token: write is granted only on the jobs that need it

env:
  AWS_REGION: sa-east-1
  TF_VERSION:      1.9.8

jobs:

  safety-check:
    name: Safety check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce develop branch
        run: bash "$GITHUB_WORKSPACE/scripts/ci/branch_guard.sh"
      - name: Validate confirmation
        run: bash "$GITHUB_WORKSPACE/scripts/ci/check_commit_confirmation.sh"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}

  preflight-oidc:
    name: Preflight — OIDC role variables
    needs: safety-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate AWS_DEPLOY_ROLE_{DEV,HML,PRD} are set
        run: |
          MISSING=""
          [ -z "${{ vars.AWS_DEPLOY_ROLE_DEV }}" ] && MISSING="$MISSING AWS_DEPLOY_ROLE_DEV"
          [ -z "${{ vars.AWS_DEPLOY_ROLE_HML }}" ] && MISSING="$MISSING AWS_DEPLOY_ROLE_HML"
          [ -z "${{ vars.AWS_DEPLOY_ROLE_PRD }}" ] && MISSING="$MISSING AWS_DEPLOY_ROLE_PRD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository variable(s):${MISSING}. Run scripts/ci/publish_oidc_vars.sh after applying services/prd/00_bootstrap — see docs/runbooks/00-bootstrap-apply.md."
            exit 1
          fi
          echo "All required OIDC role variables present."

  # ══════════════════════════════════════════════════════════════
  #  DEV
  # ══════════════════════════════════════════════════════════════

  dev-destroy:
    name: DEV — Destroy all modules
    concurrency:
      group: tf-dev
      cancel-in-progress: false
    needs: [safety-check, preflight-oidc]
    if: github.event.inputs.environment == 'DEV (Cloud AWS)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_DEV via OIDC
    timeout-minutes: 45
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Destroy DEV
        run: bash "$GITHUB_WORKSPACE/scripts/ci/destroy_env.sh" dev
        env:
          TF_VAR_databricks_dev_uc_external_id: ${{ secrets.DATABRICKS_UC_EXTERNAL_ID }}

  # ══════════════════════════════════════════════════════════════
  #  HML
  # ══════════════════════════════════════════════════════════════
  # Post-B2 purge, hml's only surviving stack is 04_peripherals — destroy_env.sh
  # destroys every stack_map.json-declared hml stack unconditionally; the
  # `full_destroy` input is accepted but not consumed (T-R.2 F-07).

  hml-destroy:
    name: HML — Destroy modules
    concurrency:
      group: tf-hml
      cancel-in-progress: false
    needs: [safety-check, preflight-oidc]
    if: github.event.inputs.environment == 'hml'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_HML via OIDC
    timeout-minutes: 45
    environment: hml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_HML }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Destroy HML
        env:
          # F-07: DATABRICKS_ACCOUNT_ID/CLIENT_ID/CLIENT_SECRET removed — no
          # `databricks` Terraform provider block or CLI call consumes them on
          # this path (grep-verified); they were dead repo-scoped-secret reads.
          TF_VAR_databricks_hml_uc_external_id: ${{ secrets.DATABRICKS_UC_EXTERNAL_ID }}
          # F-09: env-indirection — never substitute an event input as a CLI arg
          # directly into a `run:` script body.
          FULL_DESTROY: ${{ github.event.inputs.full_destroy }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/destroy_env.sh" hml "${FULL_DESTROY}"

  # ══════════════════════════════════════════════════════════════
  #  PRD
  # ══════════════════════════════════════════════════════════════

  prd-destroy:
    name: PRD — Destroy all modules
    concurrency:
      group: tf-prd
      cancel-in-progress: false
    needs: [safety-check, preflight-oidc]
    if: github.event.inputs.environment == 'prd'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_PRD via OIDC
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PRD }}
          aws-region:     ${{ env.AWS_REGION }}
      - name: Destroy PRD
        run: bash "$GITHUB_WORKSPACE/scripts/ci/destroy_env.sh" prd

