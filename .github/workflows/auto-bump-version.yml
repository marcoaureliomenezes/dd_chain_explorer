name: Auto Bump Version

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write

# CI-M9 — Serialize VERSION bumps. Two PRs merging to develop near-simultaneously
# would race the bump (lost update / push conflict). Do not cancel an in-flight
# bump (cancel-in-progress: false) — a cancelled bump can leave VERSION half-written.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump VERSION on merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        run: bash "$GITHUB_WORKSPACE/scripts/ci/bump_version.sh"
        env:
          PR_TITLE:  ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
