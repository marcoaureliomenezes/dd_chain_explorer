name: Destroy ALL Cloud Infra

# ─────────────────────────────────────────────────────────────────────────────
# NUCLEAR OPTION — destroys every SURVIVING resource across PRD, HML and DEV.
# prd/00_bootstrap and prd/01_tf_state are NEVER destroyed by this workflow —
# 00_bootstrap is the operator-only-applied OIDC stack CI must never mutate
# (D14, O-1), and 01_tf_state is the remote-state backend every other stack's
# apply/destroy depends on.
#
# Surviving stacks (SPEC §2.2 B1/B2 — every capture-era stack is deleted from
# disk, not merely destroyed):
#   DEV: 01_peripherals, 02_lambda
#   PRD: 03_iam, 04_peripherals, 06_lambda   (NEVER 00_bootstrap, 01_tf_state)
#   HML: 04_peripherals                       (the minimal lane, B2)
#
# S3 buckets are emptied (including all object versions) before their stack's
# `terraform destroy`, since a non-empty bucket blocks deletion.
# Idempotent: if a resource is not in TF state, the job succeeds with no changes.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY ALL to confirm complete infrastructure destruction'
        required: true
        type: string

permissions:
  contents: read  # F-04: id-token: write is granted only on the jobs that need it

# Serialize the nuclear teardown — two concurrent dispatches racing the same
# backend would corrupt/orphan remote state for all stacks. Shares its group
# with deploy_cloud_infra.yml and destroy_cloud_infra.yml per environment is
# not meaningful here (this workflow spans all three environments at once),
# so it keeps its own dedicated group. Never cancel an in-flight destroy
# mid-teardown — a half-killed destroy is worse than serializing.
concurrency:
  group: destroy-all-cloud-infra
  cancel-in-progress: false

env:
  AWS_REGION:      sa-east-1
  TF_VERSION:      1.9.8
  DEV_ROOT:        services/dev
  PRD_ROOT:        services/prd
  HML_ROOT:        services/hml

jobs:

  safety-check:
    name: Safety check — confirm phrase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Verify confirmation phrase
        env:
          # F-09: env-indirection — inputs.confirm is free-form text; never
          # substitute it directly into a `run:` script body.
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "DESTROY ALL" ]; then
            echo "::error::Confirmation phrase must be exactly 'DESTROY ALL'. Got: '${CONFIRM}'"
            exit 1
          fi
          echo "Confirmed — proceeding with full destroy."

  preflight-oidc:
    name: Preflight — OIDC role variables
    needs: safety-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Validate AWS_DEPLOY_ROLE_{DEV,HML,PRD} are set
        run: |
          MISSING=""
          [ -z "${{ vars.AWS_DEPLOY_ROLE_DEV }}" ] && MISSING="$MISSING AWS_DEPLOY_ROLE_DEV"
          [ -z "${{ vars.AWS_DEPLOY_ROLE_HML }}" ] && MISSING="$MISSING AWS_DEPLOY_ROLE_HML"
          [ -z "${{ vars.AWS_DEPLOY_ROLE_PRD }}" ] && MISSING="$MISSING AWS_DEPLOY_ROLE_PRD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository variable(s):${MISSING}. Run scripts/ci/publish_oidc_vars.sh after applying services/prd/00_bootstrap — see docs/runbooks/00-bootstrap-apply.md."
            exit 1
          fi
          echo "All required OIDC role variables present."

  # ══════════════════════════════════════════════════════════════════════════
  #  DEV — 02_lambda, then 01_peripherals (S3 emptied first)
  # ══════════════════════════════════════════════════════════════════════════

  dev-destroy-lambda:
    name: DEV — Destroy 02_lambda
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_DEV via OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: gha-destroy-all-cloud-infra-dev-destroy-lambda
          mask-aws-account-id: true
      - name: terraform destroy
        run: |
          terraform -chdir="${{ env.DEV_ROOT }}/02_lambda" init -input=false -reconfigure
          terraform -chdir="${{ env.DEV_ROOT }}/02_lambda" destroy -input=false -auto-approve

  dev-destroy-peripherals:
    name: DEV — Destroy 01_peripherals
    needs: dev-destroy-lambda
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_DEV via OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: gha-destroy-all-cloud-infra-dev-destroy-peripherals
          mask-aws-account-id: true
      - name: Empty dev S3 buckets (all object versions)
        run: bash scripts/ci/empty_s3_and_ecr.sh dev
        continue-on-error: true
      - name: terraform destroy
        run: |
          terraform -chdir="${{ env.DEV_ROOT }}/01_peripherals" init -input=false -reconfigure
          terraform -chdir="${{ env.DEV_ROOT }}/01_peripherals" destroy -input=false -auto-approve
        env:
          TF_VAR_databricks_dev_uc_external_id: ${{ secrets.DATABRICKS_UC_EXTERNAL_ID }}

  # ══════════════════════════════════════════════════════════════════════════
  #  HML — 04_peripherals only (the minimal lane, B2)
  # ══════════════════════════════════════════════════════════════════════════

  hml-destroy-peripherals:
    name: HML — Destroy 04_peripherals
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_HML via OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_HML }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: gha-destroy-all-cloud-infra-hml-destroy-peripherals
          mask-aws-account-id: true
      - name: Empty hml S3 buckets (all object versions)
        run: bash scripts/ci/empty_s3_and_ecr.sh hml
        continue-on-error: true
      - name: terraform destroy
        run: |
          terraform -chdir="${{ env.HML_ROOT }}/04_peripherals" init -input=false -reconfigure
          terraform -chdir="${{ env.HML_ROOT }}/04_peripherals" destroy -input=false -auto-approve
        env:
          TF_VAR_databricks_hml_uc_external_id: ${{ secrets.DATABRICKS_UC_EXTERNAL_ID }}

  # ══════════════════════════════════════════════════════════════════════════
  #  PRD — 06_lambda, 04_peripherals (S3 emptied first), then 03_iam
  #  (00_bootstrap and 01_tf_state are NEVER destroyed here)
  # ══════════════════════════════════════════════════════════════════════════

  prd-destroy-lambda:
    name: PRD — Destroy 06_lambda
    needs: preflight-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_PRD via OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PRD }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: gha-destroy-all-cloud-infra-prd-destroy-lambda
          mask-aws-account-id: true
      - name: terraform destroy
        run: |
          terraform -chdir="${{ env.PRD_ROOT }}/06_lambda" init -input=false -reconfigure
          terraform -chdir="${{ env.PRD_ROOT }}/06_lambda" destroy -input=false -auto-approve

  prd-destroy-peripherals:
    name: PRD — Destroy 04_peripherals
    needs: prd-destroy-lambda
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_PRD via OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PRD }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: gha-destroy-all-cloud-infra-prd-destroy-peripherals
          mask-aws-account-id: true
      - name: Empty prd S3 buckets (all object versions, incl. the artifacts bucket)
        run: bash scripts/ci/empty_s3_and_ecr.sh prd
        continue-on-error: true
      - name: terraform destroy
        run: |
          terraform -chdir="${{ env.PRD_ROOT }}/04_peripherals" init -input=false -reconfigure
          terraform -chdir="${{ env.PRD_ROOT }}/04_peripherals" destroy -input=false -auto-approve

  prd-destroy-iam:
    name: PRD — Destroy 03_iam
    needs: prd-destroy-peripherals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # F-04: needed to assume AWS_DEPLOY_ROLE_PRD via OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PRD }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: gha-destroy-all-cloud-infra-prd-destroy-iam
          mask-aws-account-id: true
      - name: terraform destroy
        run: |
          terraform -chdir="${{ env.PRD_ROOT }}/03_iam" init -input=false -reconfigure
          terraform -chdir="${{ env.PRD_ROOT }}/03_iam" destroy -input=false -auto-approve

  # ══════════════════════════════════════════════════════════════════════════

  final-summary:
    name: Final summary
    needs:
      - dev-destroy-peripherals
      - hml-destroy-peripherals
      - prd-destroy-iam
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Write summary
        run: |
          {
            echo "## Destroy ALL — summary"
            echo "| Stack | Result |"
            echo "|---|---|"
            echo "| dev/01_peripherals, dev/02_lambda | ${{ needs.dev-destroy-peripherals.result }} |"
            echo "| hml/04_peripherals | ${{ needs.hml-destroy-peripherals.result }} |"
            echo "| prd/03_iam, prd/04_peripherals, prd/06_lambda | ${{ needs.prd-destroy-iam.result }} |"
            echo "prd/00_bootstrap and prd/01_tf_state are never destroyed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
